name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  installed-wheel:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build ruff pytest
      - run: python -m ruff check src tests bench
      - name: Fetch pinned Boost headers for the native consumer test
        shell: bash
        run: |
          curl --fail --location --retry 3 https://archives.boost.io/release/1.89.0/source/boost_1_89_0.tar.bz2 -o boost.tar.bz2
          python -c "import hashlib; assert hashlib.sha256(open('boost.tar.bz2','rb').read()).hexdigest() == '85a33fa22621b4f314f8e85e1a5e2a9363d22e4f4992925d4bb3bc631b5a0c7a'"
          tar -xjf boost.tar.bz2 boost_1_89_0/boost
          echo "RBSVD_BOOST_INCLUDE=$GITHUB_WORKSPACE/boost_1_89_0" >> "$GITHUB_ENV"
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Test installed wheel from outside checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -q
      - run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir sdist-wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*

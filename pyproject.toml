[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rational-bidiagonal-svd"
version = "0.1.1"
description = "Selected bidiagonal singular directions using rational spectral filters"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kaiwen Jin", email = "yui.ui.siki@gmail.com"}]
dependencies = ["numpy>=1.26", "mpmath==1.3.0"]

[project.urls]
Repository = "https://github.com/yuiyuiui/rational-bidiagonal-svd"
Documentation = "https://github.com/yuiyuiui/rational-bidiagonal-svd/tree/main/docs"
Issues = "https://github.com/yuiyuiui/rational-bidiagonal-svd/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["build>=1.3", "ruff>=0.14", "pytest>=8"]
figures = ["matplotlib>=3.8"]

[project.scripts]
rational-bidiagonal-svd = "rational_bidiagonal_svd.cli:main"

[tool.setuptools.package-data]
rational_bidiagonal_svd = ["core.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: executes the full precision rational kernel"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
# Preserve the compact legacy notation; reject syntax and definite name errors.
